[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "nse-research-lab"
version = "0.1.0"
description = "Reproducible India-only equity modelling, conservative backtests and local replay"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "lightgbm", "optuna", "requests", "joblib"]
[project.optional-dependencies]
test = ["pytest"]
[project.scripts]
nselab = "nselab.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
